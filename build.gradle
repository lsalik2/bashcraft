plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

fabricApi {
	// Client game tests (src/gametest) drive a real dev client against an integrated server.
	configureTests {
		createSourceSet = true
		modId = "bashcraft-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// One parser for the docs' "Give it a try!" snippets, used by the unit tests and the in-game snippet test.
sourceSets {
	test { java { srcDir "src/docs/java" } }
	gametest { java { srcDir "src/docs/java" } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// DocsTest and ModMetadataTest read these files: a docs-only change must still re-run them.
	inputs.files("README.md", "CHANGELOG.md", "LICENSE", "gradle.properties", "CONTRIBUTING.md", "SECURITY.md").optional()
	inputs.dir("docs").optional()
	// The contribution templates' links, and the workflows that README badges name.
	inputs.files(fileTree(".github") { exclude "**/__pycache__/**" })
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// MIT asks for the notice in every copy: the jar carries LICENSE (Fabric's usual name for it).
jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Uploads a release to GitHub, Modrinth and CurseForge (spec E §4). The Release workflow runs it with
// BASHCRAFT_PUBLISH=true and the tokens; anywhere else it's a dry run that writes what it would send to
// build/publishMods. -PreleaseNotes names the notes file (python3 .github/scripts/release.py notes VERSION > FILE).
def releaseNotes = providers.gradleProperty("releaseNotes")
publishMods {
	file = jar.archiveFile
	displayName = "BashCraft v${project.version}"
	changelog = releaseNotes.map { file(it).text }.orElse(providers.provider {
		throw new GradleException("Publishing needs release notes: python3 .github/scripts/release.py notes ${project.version} > build/release-notes.md, then -PreleaseNotes=build/release-notes.md")
	})
	type = STABLE
	modLoaders.add("fabric")
	dryRun = providers.environmentVariable("BASHCRAFT_PUBLISH").map { it != "true" }.orElse(true)

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = "lsalik2/bashcraft"
		commitish = "main"
		tagName = "v${project.version}"
	}
	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = project.modrinth_id
		minecraftVersions.add(project.minecraft_version)
		requires("fabric-api")
	}
	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = project.curseforge_id
		minecraftVersions.add(project.minecraft_version)
		javaVersions.add(JavaVersion.VERSION_25)
		client = true
		server = true
		requires("fabric-api")
		changelogType = "markdown"
	}
}

// Headless client game tests: where an Xvfb is installed (~/.local/bin/Xvfb on the WSL dev machine), runClientGameTest
// starts its own virtual display and runs the client there, so no window opens on the desktop and screenshots still
// render. -Pheadless=false uses the real display. Display numbers 200-299 keep clear of Synergy's (99-199).
def xvfbExecutable = [new File(System.getProperty("user.home"), ".local/bin/Xvfb"), new File("/usr/bin/Xvfb")].find { it.canExecute() }
def headlessProperty = providers.gradleProperty("headless").orNull
def headlessTests = headlessProperty != null ? headlessProperty.toBoolean() : (xvfbExecutable != null && System.getenv("CI") == null)

// Holds the Xvfb process of a headless run and stops it when the build ends, whether the tests passed or not.
abstract class XvfbDisplay implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None>, AutoCloseable {
	Process process

	@Override
	void close() {
		process?.destroy()
	}
}
def xvfbDisplay = gradle.sharedServices.registerIfAbsent("bashcraftXvfbDisplay", XvfbDisplay) {}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	systemProperty "bashcraft.projectDir", project.projectDir.absolutePath
	usesService(xvfbDisplay)
	doFirst {
		if (!headlessTests) return
		if (xvfbExecutable == null) throw new GradleException("-Pheadless needs Xvfb (~/.local/bin/Xvfb or /usr/bin/Xvfb)")
		// The first free display number; Xvfb listens on Linux's abstract socket, since WSLg's /tmp/.X11-unix is read-only.
		int display = (200..299).find { !new File("/tmp/.X${it}-lock").exists() }
		def log = file("build/xvfb.log")
		log.parentFile.mkdirs()
		def process = new ProcessBuilder(xvfbExecutable.path, ":${display}", "-screen", "0", "1920x1080x24", "-nolisten", "tcp")
			.redirectErrorStream(true).redirectOutput(log).start()
		xvfbDisplay.get().process = process
		def socket = "@/tmp/.X11-unix/X${display}"
		def ready = (1..50).any {
			if (!process.alive) return false
			if (new File("/proc/net/unix").readLines().any { it.endsWith(socket) }) return true
			sleep(100)
			false
		}
		if (!ready) throw new GradleException("Xvfb did not start on :${display} (see ${project.relativePath(log)}); -Pheadless=false uses the real display")
		logger.lifecycle("Headless: the client runs on Xvfb display :${display} (-Pheadless=false for a window)")
		environment("DISPLAY", ":${display}")
		// SDL prefers Wayland (WSLg) over X11, which would open the window on the desktop after all.
		environment.remove("WAYLAND_DISPLAY")
		environment("SDL_VIDEO_DRIVER", "x11")
		environment("SDL_VIDEODRIVER", "x11")
		// Xvfb's GLX has no visual the client accepts: start on Vulkan (Mesa's software lavapipe).
		args("--graphicsBackend", "vulkan")
	}
}

// Re-captures the docs' screenshots into docs/images/screens (the screenshot check only runs when asked for).
tasks.register("updateScreenshots") {
	group = "documentation"
	description = "Runs the client game tests and saves the docs' screenshots to docs/images/screens"
	dependsOn "runClientGameTest"
}
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	doFirst {
		if (gradle.taskGraph.hasTask(":updateScreenshots")) {
			systemProperty "bashcraft.screenshots", file("docs/images/screens").absolutePath
		}
	}
}
